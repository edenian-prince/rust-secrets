name: Build and Release Rust Package

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - uses: actions/checkout@v5

      # Generate changelog and determine tag
      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-summary: true

      # Stop if no new version
      - name: Stop if skipped
        if: ${{ steps.changelog.outputs.skipped == 'true' }}
        run: echo "No new version — skipping build."

      # Inject new version into Cargo.toml to match tag
      - name: Update Cargo.toml version to match release tag
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          TAG="${{ steps.changelog.outputs.tag }}"
          VERSION="${TAG#v}" # strip leading v if present
          echo "Updating Cargo.toml version to $VERSION"
          sed -i "s/^version *= *.*/version = \"$VERSION\"/" Cargo.toml

      # Install Rust
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: |
            x86_64-unknown-linux-musl
            x86_64-pc-windows-gnu
      
      # - name: Build
      #   uses: actions-rs/cargo@v1
      #   with:
      #     command: build
      #     args: --release --target x86_64-unknown-linux-musl
      - name: Install MUSL tools
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install MinGW
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: sudo apt-get install -y mingw-w64

      # Build Linux binary
      - name: Build Linux MUSL release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          

      # Windows setup
      - name: Install Windows target
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW (for Windows linker)
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: sudo apt-get install -y mingw-w64

      # Build Windows binary
      - name: Build Windows release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: cargo build --release --target x86_64-pc-windows-gnu

      # Prepare release artifacts
      - name: Prepare assets
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/git-find release/git-find-linux-musl-x86_64
          cp target/x86_64-pc-windows-gnu/release/git-find.exe release/git-find-windows-x86_64.exe
          ls -l release

      # Create GitHub Release
      - name: Create GitHub release and upload assets
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          gh release create "${TAG}" release/* \
            --title "${TAG}" \
            --notes "${CHANGELOG}" \
            --discussion-category "Announcements"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.clean_changelog }}

      # Commit updated Cargo.toml if version changed
      - name: Commit version bump
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to $VERSION"
          git push
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
